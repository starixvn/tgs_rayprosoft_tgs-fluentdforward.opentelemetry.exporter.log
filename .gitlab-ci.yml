include:
  - project: rayprosoft/tgs-ci-scripts
    ref: main
    file: GitLab/Templates/gitlab-job-templates.yml

variables:
  BuildCacheKey: FluentdForward.OpenTelemetry.$CI_PIPELINE_IID

stages:
  - build
  - test
  - publish

build-code:
  extends: .build-code-template

unit-test:
  extends: .unit-test-template
  script:
    - dotnet test "**/bin/$BuildConfiguration/$Framework/*Tests.dll" -l:'junit;LogFilePath=TestResults/TestResults.xml'

push-nuget:
  extends: .push-nuget-template
  script:
    - dotnet pack FluentdForward.OpenTelemetry.Exporter.Logs/FluentdForward.OpenTelemetry.Exporter.Logs.csproj --no-restore --configuration Release
  artifacts:
    paths:
      - FluentdForward.OpenTelemetry.Exporter.Logs/bin/Release/*.nupkg

push-docker-image:
  extends: .push-docker-image-template
  script:
    - push_docker "tgs-fluentdforward.opentelemetry.exporter.log"