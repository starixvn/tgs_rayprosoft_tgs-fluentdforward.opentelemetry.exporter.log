include:
  - project: rayprosoft/tgs-ci-scripts
    ref: main
    file: GitLab/Templates/gitlab-job-templates.yml

variables:
  BuildCacheKey: FluentdForward.OpenTelemetry.$CI_PIPELINE_IID

stages:
  - build
  - publish

build-code:
  extends: .build-code-template

# unit-test:
#   extends: .unit-test-template
#   script:
#     - dotnet test "**/bin/$BuildConfiguration/$Framework/*Test.dll" -l:'junit;LogFilePath=TestResults/TestResults.xml'

push-nuget:
  extends: .push-nuget-template
  script:
    - push_package "Tgs.Core.FluentdForward.OpenTelemetry"
  artifacts:
    paths:
      - Tgs.Core.FluentdForward.OpenTelemetry/bin/$BuildConfiguration/*.nupkg
